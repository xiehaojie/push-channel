<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Push Channel Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <section id="setup-panel">
            <div class="setup-heading">
                <div>
                    <h1>OpenClaw Chat</h1>
                    <p id="connection-status">Disconnected</p>
                </div>
                <button id="disconnect-btn" type="button" disabled>Disconnect</button>
            </div>

            <form id="connect-form" class="setup-grid">
                <label>
                    Middleware URL
                    <input type="text" id="server-url-input" value="http://localhost:3001" required>
                </label>
                <label>
                    User Agent ID
                    <input type="text" id="agent-id-input" value="demo-agent" required>
                </label>
                <label>
                    OpenClaw Agent
                    <input type="text" id="openclaw-agent-id-input" value="main" required>
                </label>
                <label>
                    Session ID
                    <input type="text" id="session-id-input" required>
                </label>
                <button type="submit" id="connect-btn">Connect</button>
            </form>
        </section>

        <section id="chat-container">
            <div id="chat-toolbar">
                <span id="agent-display">No agent connected</span>
                <span id="tool-status" class="tool-status" hidden>Tools running...</span>
            </div>
            <div id="messages" aria-live="polite"></div>
            <form id="message-form">
                <input type="text" id="message-input" placeholder="Type a message..." required disabled>
                <button type="submit" id="send-btn" disabled>Send</button>
            </form>
        </section>
    </div>

    <script src="sdk.js"></script>
    <script>
        let sdk = null;
        let isToolRunning = false;
        const localQueryIds = new Set();

        const connectForm = document.getElementById('connect-form');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const serverUrlInput = document.getElementById('server-url-input');
        const agentIdInput = document.getElementById('agent-id-input');
        const sessionIdInput = document.getElementById('session-id-input');
        const connectionStatus = document.getElementById('connection-status');
        const agentDisplay = document.getElementById('agent-display');
        const messagesDiv = document.getElementById('messages');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const toolStatus = document.getElementById('tool-status');

        function createSessionId(agentId) {
            if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                return `${agentId}-${window.crypto.randomUUID()}`;
            }
            return `${agentId}-${Date.now()}`;
        }

        function setConnected(connected) {
            messageInput.disabled = !connected;
            sendBtn.disabled = !connected;
            disconnectBtn.disabled = !connected;
            connectForm.querySelectorAll('input, button').forEach((element) => {
                element.disabled = connected;
            });
        }

        function updateToolStatus() {
            toolStatus.hidden = !isToolRunning;
        }

        function isCurrentSession(data) {
            return !data.sessionId || data.sessionId === sessionIdInput.value.trim();
        }

        function appendText(parent, text) {
            parent.appendChild(document.createTextNode(text));
        }

        function appendMessage(sender, text, className, meta = {}) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            if (meta.answerMessageId) div.dataset.answerMessageId = meta.answerMessageId;
            if (meta.queryMessageId) div.dataset.queryMessageId = meta.queryMessageId;
            if (meta.sessionId) div.dataset.sessionId = meta.sessionId;

            const label = document.createElement('strong');
            label.textContent = sender;
            const content = document.createElement('span');
            content.className = 'content';
            appendText(content, text);

            div.append(label, content);
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return div;
        }

        function appendSystemMessage(text) {
            appendMessage('System', text, 'system');
        }

        function streamSelector(data) {
            if (data.answerMessageId) {
                return `.stream-active[data-answer-message-id="${CSS.escape(data.answerMessageId)}"] .content`;
            }
            if (data.sessionId) {
                return `.stream-active[data-session-id="${CSS.escape(data.sessionId)}"] .content`;
            }
            return '.stream-active .content';
        }

        function ensureStream(data) {
            let content = messagesDiv.querySelector(streamSelector(data));
            if (content) return content;

            const div = appendMessage(data.from || 'Assistant', '', 'bot stream-active', data);
            return div.querySelector('.content');
        }

        function finalizeStream(data) {
            const selector = data.answerMessageId
                ? `.stream-active[data-answer-message-id="${CSS.escape(data.answerMessageId)}"]`
                : '.stream-active';
            const active = messagesDiv.querySelector(selector);
            if (active) active.classList.remove('stream-active');
        }

        function attachSdkHandlers() {
            sdk.onRegistered((data) => {
                connectionStatus.textContent = 'Connected';
                agentDisplay.textContent = `Agent: ${data.agentId}`;
                setConnected(true);
                messageInput.focus();
            });

            sdk.onMessageSent((data) => {
                if (!isCurrentSession(data)) return;
                if (data.queryMessageId && localQueryIds.has(data.queryMessageId)) return;
                appendMessage('User', data.content || '', 'you', data);
            });

            sdk.onMessage((data) => {
                if (!isCurrentSession(data)) return;
                appendMessage('Assistant', data.content || '', 'bot', data);
            });

            sdk.onStreamStart((data) => {
                if (!isCurrentSession(data)) return;
                ensureStream(data);
            });

            sdk.onStreamChunk((data) => {
                if (!isCurrentSession(data)) return;
                const activeStream = ensureStream(data);
                activeStream.textContent += data.content || '';
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });

            sdk.onStreamSnapshot((data) => {
                if (!isCurrentSession(data)) return;
                const activeStream = ensureStream(data);
                activeStream.textContent = data.snapshot || '';
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });

            sdk.onStreamEnd((data) => {
                if (!isCurrentSession(data)) return;
                finalizeStream(data);
            });

            sdk.onToolCall((data) => {
                if (!isCurrentSession(data)) return;
                const div = appendMessage('Tool', data.toolName || 'tool_call', 'system tool-call', data);
                div.dataset.toolCallId = data.toolCallId || '';
                const args = document.createElement('pre');
                args.className = 'tool-args';
                args.textContent = data.args && Object.keys(data.args).length > 0
                    ? JSON.stringify(data.args, null, 2)
                    : '(no args)';
                div.appendChild(args);
            });

            sdk.onToolResult((data) => {
                if (!isCurrentSession(data)) return;
                const id = data.toolCallId || '';
                const card = messagesDiv.querySelector(`.tool-call[data-tool-call-id="${CSS.escape(id)}"]`);
                if (card) card.classList.add('tool-done');
            });

            sdk.onToolStart(() => {
                isToolRunning = true;
                updateToolStatus();
                appendSystemMessage('Tools are running. Follow-up replies may arrive later.');
            });

            sdk.onToolEnd(() => {
                isToolRunning = false;
                updateToolStatus();
                appendSystemMessage('Tools finished.');
            });

            sdk.onTimeoutDeferred((data) => {
                appendSystemMessage(data.message || 'Tools are still running. Waiting for follow-up.');
            });

            sdk.onError((data) => {
                appendSystemMessage(data.message || 'WebSocket error');
            });

            sdk.onClose(() => {
                isToolRunning = false;
                updateToolStatus();
                setConnected(false);
                connectionStatus.textContent = 'Disconnected';
                agentDisplay.textContent = 'No agent connected';
            });
        }

        connectForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const url = serverUrlInput.value.trim();
            const agentId = agentIdInput.value.trim();
            if (!sessionIdInput.value.trim()) {
                sessionIdInput.value = createSessionId(agentId);
            }

            if (sdk) sdk.disconnect();
            messagesDiv.innerHTML = '';
            connectionStatus.textContent = 'Connecting...';
            sdk = new PushChannelSDK(url, agentId, {
                sessionId: sessionIdInput.value.trim(),
            });
            attachSdkHandlers();
            sdk.connect();
        });

        messageForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const text = messageInput.value.trim();
            const sessionId = sessionIdInput.value.trim();
            if (!text || !sdk) return;

            const queryMessageId = `query-${Date.now()}`;
            const answerMessageId = `answer-${Date.now()}`;
            localQueryIds.add(queryMessageId);
            appendMessage('You', text, 'you', { queryMessageId, sessionId });
            sdk.sendMessage(text, sessionId, {
                queryMessageId,
                answerMessageId,
            });
            messageInput.value = '';
        });

        disconnectBtn.addEventListener('click', () => {
            if (sdk) {
                sdk.disconnect();
                sdk = null;
            }
        });

        sessionIdInput.value = createSessionId(agentIdInput.value.trim());
        agentIdInput.addEventListener('change', () => {
            sessionIdInput.value = createSessionId(agentIdInput.value.trim());
        });
    </script>
</body>

</html>
